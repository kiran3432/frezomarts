<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rider App MVP</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="brand">
        <p class="brand-tag">Bike Taxi</p>
        <h1>Rider App</h1>
        <p class="brand-sub">Fast pickup, transparent fare, real-time trip updates.</p>
      </section>

      <section class="card">
        <h2>Book Ride</h2>
        <p class="sub">Create ride requests and watch live trip updates.</p>

        <label>
          Backend URL
          <input id="backendUrl" value="http://localhost:4000" />
        </label>

        <div class="grid-2">
          <label>
            Phone Number
            <input id="phoneNumber" value="+919900112233" />
          </label>
          <label>
            OTP
            <input id="otp" value="123456" />
          </label>
        </div>

        <div class="actions">
          <button id="requestOtpBtn" class="secondary">Request OTP</button>
          <button id="loginBtn">Login</button>
        </div>

        <label>
          Rider ID
          <input id="riderId" value="rider_1" />
        </label>

        <div class="grid-2">
          <label>
            Pickup Address
            <div class="search-shell">
              <input
                id="pickupAddress"
                placeholder="Search pickup location"
                value="MG Road, Bengaluru"
                autocomplete="off"
              />
              <ul id="pickupResults" class="search-results"></ul>
            </div>
          </label>
          <label>
            Drop Address
            <div class="search-shell">
              <input
                id="dropAddress"
                placeholder="Search drop location"
                value="Koramangala, Bengaluru"
                autocomplete="off"
              />
              <ul id="dropResults" class="search-results"></ul>
            </div>
          </label>
        </div>

        <div class="actions">
          <button id="bookRideBtn">Book Ride</button>
          <button id="refreshBtn" class="secondary">Refresh Ride</button>
        </div>

        <label>
          Cancel Reason
          <input id="cancelReason" value="Plan changed" />
        </label>
        <div class="actions">
          <button id="cancelRideBtn" class="secondary">Cancel Ride</button>
          <button id="rebookBtn">Rebook Same Route</button>
        </div>
      </section>

      <section class="card">
        <h2>Live Trip</h2>
        <p id="statusPill" class="pill">No active ride</p>
        <div id="riderMap" class="map"></div>
        <p id="routeMeta" class="sub">Route preview will appear after booking.</p>
        <div class="actions">
          <select id="paymentMethod">
            <option value="UPI">UPI</option>
            <option value="CARD">CARD</option>
            <option value="CASH">CASH</option>
          </select>
          <button id="payRideBtn">Pay Now</button>
          <button id="invoiceBtn" class="secondary">Download Invoice</button>
        </div>
        <pre id="rideJson" class="json-view">Waiting for ride...</pre>
      </section>

      <section class="card">
        <h2>Status Timeline</h2>
        <ul id="timeline" class="timeline"></ul>
      </section>

      <section class="card">
        <div class="title-row">
          <h2>Trip History</h2>
          <div class="actions">
            <select id="historyStatusFilter">
              <option value="">All Status</option>
              <option value="COMPLETED">COMPLETED</option>
              <option value="CANCELLED">CANCELLED</option>
              <option value="STARTED">STARTED</option>
            </select>
            <select id="historyPaymentFilter">
              <option value="">All Payments</option>
              <option value="PAID">PAID</option>
              <option value="PENDING">PENDING</option>
            </select>
            <button id="loadHistoryBtn" class="secondary">Load History</button>
            <button id="exportHistoryBtn" class="secondary">Export CSV</button>
          </div>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./main.js"></script>
  </body>
  </html>
